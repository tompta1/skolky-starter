services:
  db:
    image: docker.io/library/postgres:16
    container_name: skolky-db
    environment:
      POSTGRES_DB: skolky
      POSTGRES_USER: skolky
      POSTGRES_PASSWORD: skolky
    ports:
      - "5432:5432"
    volumes:
      - skolky_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skolky -d skolky"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  skolky_pgdata:
